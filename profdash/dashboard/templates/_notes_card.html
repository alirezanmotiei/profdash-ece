{% from "_macros.html" import card with context %}
<div id="notes-card">
  {% call card("Notes", "updated " ~ (p.updated_at|localtz if p.updated_at else '—')) %}
    <form hx-post="/professor/{{ p.id }}/notes" hx-target="#notes-card" hx-swap="outerHTML">
      <textarea name="notes" rows="4"
                class="w-full rounded-lg bg-surface2 border border-line p-2.5 text-sm
                       focus:outline-none focus:ring-2 focus:ring-accent/40 focus:border-accent"
                placeholder="Outreach context, reminders, reply summaries&hellip;">{{ p.notes or '' }}</textarea>
      <div class="flex justify-end mt-2">
        <button type="submit"
                class="h-8 px-3 rounded-lg bg-accent text-white text-xs font-medium hover:bg-accent/90 transition-colors">
          Save notes
        </button>
      </div>
    </form>
  {% endcall %}
</div>
