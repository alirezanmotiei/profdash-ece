{% from "_macros.html" import card with context %}
{% if draft %}
<div id="draft-card" x-data="{ copied: false }">
  {% call card("Latest Draft", (draft.at|localtz) ~ (" &middot; in Gmail drafts" if draft.gmail_saved else " &middot; stored locally only")) %}
    <div class="flex items-center justify-between gap-2 mb-2">
      <h3 class="text-sm font-semibold">{{ draft.subject or '(no subject)' }}</h3>
      <button @click="navigator.clipboard.writeText($refs.body.innerText); copied = true; setTimeout(() => copied = false, 1500)"
              class="shrink-0 h-7 px-2.5 rounded-lg border border-line text-xs hover:bg-surface2 transition-colors whitespace-nowrap">
        <span x-text="copied ? 'Copied!' : 'Copy'"></span>
      </button>
    </div>
    <div x-ref="body"
         class="rounded-lg bg-surface2 border border-line p-3 text-sm whitespace-pre-wrap max-h-72 overflow-y-auto leading-relaxed">{{ draft.body }}</div>
  {% endcall %}
</div>
{% endif %}
